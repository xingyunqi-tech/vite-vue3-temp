#### 网站相关
replicaCount: 1
fpRuntime: /usr/local/txwl
opodIp: 127.0.0.1
opodPort: 9700
fpIp: 127.0.0.1
fpPort: 80
protocolType: http
overseas: false
middleRepo:
  ip: 127.0.0.1
  port: 8888
vpp:
  ip: 127.0.0.1
  port: 8888
viidNginxConf: "location /viid_image/viid1/ { proxy_pass http://10.10.10.40:9998/; } location /viid_image/viid2/ { proxy_pass http://10.10.50.40:9998/; }"

# 开启nginx status 开关
enable_nginx_monitor: false

images:
  ## template使用
  registry:
  repository: txwl
  webRepository: txwl
  private_docker_registry: ""
  public_docker_registry: ""

#### 其他
build_mode: release

### 本地配置
txwlConfigServer:
  name: txwl-config-server
  pullPolicy: IfNotPresent
  nodeNum: 1
  port: 31100
  dataPath: /home/yituadmin/frontend/txwl-website/website-helm-3.0.0/website/data
  image: txwl-config:e2e38577-amd64

### 前端网页
txwlNginx:
  name: txwl-backend-nginx
  pullPolicy: IfNotPresent
  nodeNum: 1
  image: nginx_vts:1.22.1
