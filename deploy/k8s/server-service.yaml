apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.txwlConfigServer.name }}
  labels:
    app: {{ .Values.txwlConfigServer.name }}
spec:
  selector:
    app: {{ .Values.txwlConfigServer.name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.txwlConfigServer.port }}
      targetPort: {{ .Values.txwlConfigServer.port }}
