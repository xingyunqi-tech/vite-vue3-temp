apiVersion: apps/v1
kind: Deployment
metadata:
  name: txwl-website
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: txwl-website
  template:
    metadata:
      labels:
        app: txwl-website
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        txwl.k8s.svc.web: "true"
      imagePullSecrets:
        - name: regcred
      containers:
        - name: txwl-website-nginx-container
          image: {{if eq .Values.build_mode "dev"}}{{ .Values.images.registry }}/{{end}}{{ .Values.images.repository }}/{{ .Values.txwlNginx.image }}
          ports:
            - containerPort: 11180
              hostPort: 11180
            - containerPort: 11181
              hostPort: 11181
          volumeMounts:
            - name: nginx-{{ .Values.protocolType }}-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-inject-volume
              mountPath: /etc/nginx/nginx-inject.conf
              subPath: nginx-inject.conf
            - name: nginx-common-volume
              mountPath: /etc/nginx/nginx-common.conf
              subPath: nginx-common.conf
            - name: nginx-opod-volume
              mountPath: /etc/nginx/nginx-opod.conf
              subPath: nginx-opod.conf
            - name: cert-volume
              mountPath: /etc/nginx/crt.crt
              subPath: crt.crt
            - name: cert-volume
              mountPath: /etc/nginx/key.key
              subPath: key.key
            - name: txwl-website-data
              mountPath: /usr/src/app/data
            - name: timezone-config
              mountPath: /etc/timezone
            - name: localtime-config
              mountPath: /etc/localtime
            - name: frontend-lib
              mountPath: /usr/share/nginx/html/frontend
      volumes:
        - name: txwl-website-data
          hostPath:
            path: {{ .Values.fpRuntime }}/data
            type: DirectoryOrCreate
        - name: nginx-http-volume
          configMap:
            name: nginx-http
        - name: nginx-https-volume
          configMap:
            name: nginx-https
        - name: nginx-http-https-volume
          configMap:
            name: nginx-http-https
        - name: nginx-inject-volume
          configMap:
            name: nginx-inject
        - name: nginx-opod-volume
          configMap:
            name: nginx-opod
        - name: nginx-common-volume
          configMap:
            name: nginx-common
        - name: cert-volume
          configMap:
            name: cert
        - name: timezone-config
          hostPath:
            path: /etc/timezone
        - name: localtime-config
          hostPath:
            path: /etc/localtime
        - name: frontend-lib
          hostPath:
            path: {{ .Values.fpRuntime }}/frontend
            type: DirectoryOrCreate
