
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-https
data:
  nginx.conf: |
    #user www-data;
    worker_processes 4;

    pid /usr/src/app/data/nginx.pid;

    events {
        worker_connections 1024;
    # multi_accept on;
    }

    http {
        log_format with_time '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" http_x_forwarded_for: "$http_x_forwarded_for"' X-Forwarded-For: '"$proxy_add_x_forwarded_for"' X-Real-IP, REMOTE_ADDR: '"$remote_addr"';

        map $time_iso8601 $logdate {
        '~^(?<ymd>\d{4}-\d{2}-\d{2})' $ymd;
        default                       'date-not-found';
        }
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_comp_level 2;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml image/jpeg image/webp image/png application/javascript application/json;

        access_log /dev/stdout with_time;
        error_log /dev/stderr;

        #use NGINX to proxy static files
        # without 2 lines below the css proxies will not work
        # WARNING: mime.types should exists in the same folder!
        include       mime.types;
        default_type  application/octet-stream;

        {{ if eq .Values.enable_nginx_monitor true }}
        vhost_traffic_status_zone shared:vhost_traffic_status:100m;
        {{ end }}

        server {
            #如果需要使用https, 需要注释掉 http start 到 http end 之间的内容，解注掉 https start 到 https end 中的内容
            #https start
            listen 11181 ssl;
            server_name 127.0.0.1;
            #这里可以使用绝对路径，制定对应的crt和key文件
            ssl_certificate ./crt.crt;
            ssl_certificate_key ./key.key;

            ssl_session_cache shared:SSL:20m;
            ssl_session_timeout 60m;
            ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

            # 强制浏览器使用https（只对域名有效）
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains;preload";
            #https end

            fastcgi_read_timeout 12000;
            fastcgi_buffers 16 8k;
            fastcgi_buffer_size 8k;
            fastcgi_busy_buffers_size 64k;
            client_max_body_size 5120m;
            underscores_in_headers on;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE_ADDR $remote_addr;

            proxy_max_temp_file_size 6144m;

            proxy_connect_timeout 300s;
            keepalive_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            # inject:start
            include nginx-inject.conf;
            # inject:end

            # opod
            include nginx-opod.conf;

            # viid
            {{ .Values.viidNginxConf }}

            # common
            include nginx-common.conf;
        }

        server {
            listen 11180;

            fastcgi_read_timeout 12000;
            fastcgi_buffers 16 8k;
            fastcgi_buffer_size 8k;
            client_max_body_size 5120m;
            underscores_in_headers on;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE_ADDR $remote_addr;

            proxy_connect_timeout 300s;
            keepalive_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            # inject:start
            include nginx-inject.conf;
            # inject:end
            
            # opod
            include nginx-opod.conf;

            # viid
            {{ .Values.viidNginxConf }}

            location / {
              rewrite ^/(.*) https://$host:11181$uri redirect;
            }
        }
    }
