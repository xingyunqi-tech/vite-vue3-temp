apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-opod
data:
  nginx-opod.conf: |
    location ^~ /txwl/l5/ {
        proxy_pass http://{{ .Values.opodIp }}:{{ .Values.opodPort }};
        add_header Cache-Control 'no-store,no-cache';
    }

    location /l1server/ {
      proxy_pass http://{{ .Values.opodIp }}:9759/;
    }

    location /l5server/ {
      proxy_pass http://{{ .Values.opodIp }}:9759/;
    }
