apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-inject
data:
  nginx-inject.conf: |
    {{ if eq .Values.enable_nginx_monitor true }}
    vhost_traffic_status_filter_by_host on;
    vhost_traffic_status_filter_by_set_key $uri uri;
    vhost_traffic_status_filter_by_set_key $status status;
    vhost_traffic_status_filter_by_set_key $upstream_addr upstream::backend;
    vhost_traffic_status_filter_by_set_key $remote_addr client::addr;

    vhost_traffic_status_histogram_buckets 0.005 0.01 0.05 0.1 0.5 1 5 10 30;

    location /status {
        vhost_traffic_status_bypass_stats on;
        vhost_traffic_status_display;
        vhost_traffic_status_display_format html;
    }
    {{ end }}

    location /face/v1/framework/face/log/statistic/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face/log/statistic;
    }

    location /face/v1/framework/face/log/append/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face/log/append;
    }

    location /face/v1/framework/face_video/surveillance/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face_video/surveillance;
    }

    location /face/v1/framework/face/retrieval/results/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face/retrieval/results;
    }

    location /business/api {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/business/api;
    }

    location /business/api/repository/picture/failed {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face_image/repository/picture/failed;
    }

    location /business/api/storage/video {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/storage/v1/video;
    }

    location /business/api/self/cluster_id {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/platform_console/cluster_id;
    }

    location /business/api/cluster_ids {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/platform_console/cluster_id/global;
    }

    location /resource_manager/user/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/resource_manager/user;
    }

    location /website/face {
      set $flag 1;
      set $temp "$host:$http_referer";
      if ($temp ~* "^(.*):https?://\1") {
        set $flag 0;
      }
      set $temp2 "{{ .Values.opodIp }}:$http_referer";
      if ($temp2 ~* "^(.*):https?://\1") {
        set $flag 0;
      }
      if ($http_referer = "") {
        set $flag 0;
      }
      if ($flag) {
        return 403;
      }
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face;
    }

    location /face/v1/framework/face/query/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face/query;
    }

    location /face/v1/framework/face_image/repository/picture/failed/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face_image/repository/picture/failed;
    }

    location /face/v1/framework/face_image/repository/picture/synchronized/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face_image/repository/picture/synchronized;
    }

    location /face/v1/framework/face/update/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face/update;
    }

    location /face/v1/framework/face/delete/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face/delete;
    }

    location /resource_manager/user/self/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/resource_manager/user/self;
    }

    location /face/v1/framework/face_video/camera/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face_video/camera;
    }

    location /face/v1/framework/face_image/repository/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face_image/repository;
    }

    location /website/track/query/realtime {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/dynamicRepos/query/realtime;
    }

    location /face/v1/framework/resource_set/camera/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/resource_set/camera;
    }

    location /victory/query {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/storage/v1/object/batch_query;
    }

    location /victory/create {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/storage/v1/object/insert_object;
    }

    location /resource_manager/resource/get_object/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/resource_manager/resource/get_object;
    }

    location /resource_manager/resource/get_grant_permission/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/resource_manager/resource/get_grant_permission;
    }

    location /face/v1/framework/face_image/cross_retrieval/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face_image/cross_retrieval;
    }

    location /face/v1/framework/face/hit/global {
      proxy_pass http://{{ .Values.fpIp }}:{{ .Values.fpPort }}/face/v1/framework/face/hit;
    }

    location /face/v1/framework/adhoc_alert/realtime {
      proxy_pass http://{{ .Values.fpIp }}:30180/face/v1/framework/adhoc_alert/realtime;
    }

    location /face/v1/framework/temperature_alert/query {
      proxy_pass http://{{ .Values.fpIp }}:30180/face/v1/framework/temperature_alert/query;
    }

    location /face/v1/framework/temperature_alert/delete {
      proxy_pass http://{{ .Values.fpIp }}:30180/face/v1/framework/temperature_alert/delete;
    }

    location /face/v1/framework/temperature_alert/update {
      proxy_pass http://{{ .Values.fpIp }}:30180/face/v1/framework/temperature_alert/update;
    }

    location /ws {
      proxy_pass http://{{ .Values.fpIp }}:8854;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }