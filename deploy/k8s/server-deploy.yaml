apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.txwlConfigServer.name }}
spec:
  replicas: {{ .Values.txwlConfigServer.nodeNum }}
  selector:
    matchLabels:
      app: {{ .Values.txwlConfigServer.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.txwlConfigServer.name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        txwl.k8s.svc.web: "true"
      containers:
        - name: {{ .Values.txwlConfigServer.name }}-container
          image: {{ .Values.txwlConfigServer.image }}
          ports:
            - containerPort: {{ .Values.txwlConfigServer.port }}
              hostPort: {{ .Values.txwlConfigServer.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "{{ .Values.txwlConfigServer.port }}"
            - name: DB_DIR
              value: "/app/data"
          volumeMounts:
            - name: {{ .Values.txwlConfigServer.name }}-data
              mountPath: /app/data
      volumes:
        - name: {{ .Values.txwlConfigServer.name }}-data
          hostPath:
            path: {{ .Values.txwlConfigServer.dataPath }}
            type: DirectoryOrCreate
