# 镜像仓库清理工作流
# 清理 GHCR 与 TCR 个人版中的旧镜像，保留最近 2 个版本的镜像
#
# 触发条件:
#   1. deploy.yml 构建与部署成功后自动调用
#   2. 每周一 03:00（北京时间）定时执行
#   3. 手动触发（可选 dry_run 只打印不删除）
#
# GHCR: 保留最近 2 个带 tag 的镜像，同时删除无 tag 的镜像
# TCR:  保留 latest 指向的镜像（若存在）及其余最近推送的镜像，共 2 个（含各自全部 tag），其余 tag 删除
#
# TCR 清理需要额外配置仓库级 Secrets（未配置时跳过 TCR 清理）:
#   TENCENTCLOUD_SECRET_ID / TENCENTCLOUD_SECRET_KEY（建议使用仅授权 TCR 的 CAM 子账号）
# 以及仓库级 Variables:
#   TENCENT_TCR_NAMESPACE（与 deploy.yml 共用）
#   TENCENT_TCR_REGION（可选，TCR 个人版所在地域，默认 ap-guangzhou）

name: Cleanup Registry

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印将被删除的镜像，不实际删除'
        required: false
        default: false
        type: boolean
  workflow_call:

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_BASENAME: vite-vue3-temp

jobs:
  ghcr:
    name: Cleanup GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ env.IMAGE_BASENAME }}
          keep-n-tagged: 2
          delete-untagged: true
          dry-run: ${{ inputs.dry_run == true }}

  tcr:
    name: Cleanup TCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check config
        id: check
        run: |
          missing=()
          for var in TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY TCR_NAMESPACE; do
            if [[ -z "${!var}" ]]; then
              missing+=("$var")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::notice::未配置 ${missing[*]}，跳过 TCR 清理"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}

      - name: Install tccli
        if: steps.check.outputs.enabled == 'true'
        run: pipx install tccli==3.1.180.1

      - name: Delete old tags
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          repo="${TCR_NAMESPACE,,}/${IMAGE_BASENAME,,}"

          list_tags() {
            local offset=0 page count
            while :; do
              page=$(tccli tcr DescribeImagePersonal --RepoName "$repo" --Offset "$offset" --Limit 100)
              jq -c '(.Response // .).Data.TagInfo[] | {name: .TagName, digest: .TagId, time: (.PushTime // .UpdateTime // .CreationTime // "")}' <<< "$page"
              count=$(jq '(.Response // .).Data.TagInfo | length' <<< "$page")
              (( count < 100 )) && break
              offset=$(( offset + 100 ))
            done
          }

          tags=$(list_tags)
          if [[ -z "$tags" ]]; then
            echo "${repo} 没有镜像，无需清理"
            exit 0
          fi
          latest_digest=$(jq -r 'select(.name == "latest") | .digest' <<< "$tags")
          keep_digests=$(jq -sc --arg l "$latest_digest" --argjson n "$KEEP_COUNT" '
            (if $l == "" then [] else [$l] end) as $base
            | $base + (map(select(.digest as $d | $base | index($d) | not)) | group_by(.digest)
              | map({digest: .[0].digest, time: (map(.time) | max)})
              | sort_by(.time) | reverse | .[:($n - ($base | length))] | map(.digest))' <<< "$tags")
          echo "保留镜像: $(jq -r 'join(", ")' <<< "$keep_digests")"
          mapfile -t stale < <(jq -r --argjson k "$keep_digests" 'select(.digest as $d | $k | index($d) | not) | .name' <<< "$tags")
          if (( ${#stale[@]} == 0 )); then
            echo "无需清理"
          fi
          for tag in "${stale[@]}"; do
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[dry-run] 删除 ${repo}:${tag}"
            else
              echo "删除 ${repo}:${tag}"
              tccli tcr DeleteImagePersonal --RepoName "$repo" --Tag "$tag" > /dev/null
            fi
          done
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ vars.TENCENT_TCR_REGION || 'ap-guangzhou' }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          KEEP_COUNT: 2
