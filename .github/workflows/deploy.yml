# 构建与部署工作流
# 构建前端并打包 Nginx 镜像推送到 GHCR（部署时额外推送到腾讯云 TCR 个人版），通过 SSH 部署到阿里云 ECS / 腾讯云 CVM
# 阿里云与腾讯云均从 TCR 拉取镜像
#
# 触发条件: 仅手动触发 (workflow_dispatch，可选择是否部署及部署目标 aliyun / tencent / all)
#
# 配置步骤:
#   在 GitHub 仓库 Settings -> Secrets and variables -> Actions -> Secrets 中添加（<PREFIX> 为 ALIYUN 或 TENCENT，按部署目标配置）:
#     - <PREFIX>_HOST: 服务器 IP 或域名
#     - <PREFIX>_PORT: SSH 端口 (默认 22)
#     - <PREFIX>_USER: SSH 用户名
#     - <PREFIX>_SSH_KEY: SSH 私钥 (完整内容)
#     - <PREFIX>_PATH: 部署目标路径
#     - TENCENT_TCR_PASSWORD: TCR 个人版登录密码（两个目标共用）
#     - VITE_BASEURL（可选）: 生产环境接口地址，留空则请求同源
#     - SENTRY_AUTH_TOKEN（可选）: 配置后构建时上传 sourcemap 到 Sentry
#
#   在 Settings -> Secrets and variables -> Actions -> Variables 中添加:
#     - TENCENT_TCR_REGISTRY: TCR 地址（如 ccr.ccs.tencentyun.com）
#     - TENCENT_TCR_NAMESPACE: TCR 命名空间（需先在 TCR 个人版控制台创建）
#     - TENCENT_TCR_USERNAME: 腾讯云账号 UIN
#   TCR 中的镜像仓库为 <命名空间>/vite-vue3-temp，首次推送时自动创建
#
#   部署 job 使用的 Environments: aliyun-production / tencent-production
#   构建与部署成功后调用 cleanup-registry.yml 清理 GHCR / TCR 旧镜像（配置见该文件）

name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: true
        default: true
        type: boolean
      target:
        description: '部署目标'
        required: true
        default: aliyun
        type: choice
        options: [aliyun, tencent, all]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_BASENAME: vite-vue3-temp
  BASE_IMAGE: 'nginx:alpine'

jobs:
  # ==================== 构建并推送镜像 ====================
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    # 首次向 TCR 跨境推送全部镜像层耗时较长
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      git_hash: ${{ steps.info.outputs.git_hash }}
      build_time: ${{ steps.info.outputs.build_time }}
      image_tcr: ${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}:${{ steps.info.outputs.git_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build info
        id: info
        env:
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          {
            echo "hash=${GIT_HASH}"
            echo "build_at=$(date '+%Y-%m-%d_%H-%M-%S')"
            echo "branch=${GIT_BRANCH}"
          } > node_build_info.sh
          awk 'BEGIN { ORS = "<br>" } { print }' node_build_info.sh > version.html
          {
            echo "git_hash=${GIT_HASH}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "branch=${GIT_BRANCH}"
            echo "branch_tag=${GIT_BRANCH//\//-}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASEURL: ${{ secrets.VITE_BASEURL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            UPLOAD_TO_SENTRY=true pnpm build
          else
            pnpm build
          fi

      - name: Normalize image name
        id: repo
        run: |
          ghcr_image_name="${GHCR_REGISTRY}/${OWNER}/${IMAGE_BASENAME}"
          echo "ghcr_image_name=${ghcr_image_name,,}" >> "$GITHUB_OUTPUT"
          tcr_image_name="${TCR_NAMESPACE}/${IMAGE_BASENAME}"
          echo "tcr_image_name=${tcr_image_name,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify TCR config
        if: inputs.deploy
        run: |
          has_error=0
          for var in TENCENT_TCR_REGISTRY TENCENT_TCR_NAMESPACE TENCENT_TCR_USERNAME TENCENT_TCR_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::缺少 ${var}（在仓库 Actions Variables / Secrets 中配置）"
              has_error=1
            fi
          done
          [[ $has_error -eq 1 ]] && exit 1 || true
        env:
          TENCENT_TCR_REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY }}
          TENCENT_TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          TENCENT_TCR_USERNAME: ${{ vars.TENCENT_TCR_USERNAME }}
          TENCENT_TCR_PASSWORD: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Login to TCR
        if: inputs.deploy
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.TENCENT_TCR_REGISTRY }}
          username: ${{ vars.TENCENT_TCR_USERNAME }}
          password: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.repo.outputs.ghcr_image_name }}
            name=${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }},enable=${{ inputs.deploy }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=raw,value=${{ steps.info.outputs.branch_tag }}
            type=raw,value=latest,enable=${{ steps.info.outputs.branch == 'master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==================== 部署到服务器 ====================
  deploy:
    name: Deploy to ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    if: inputs.deploy
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'all' && '[{"key":"ALIYUN","name":"阿里云 ECS","environment":"aliyun-production"},{"key":"TENCENT","name":"腾讯云 CVM","environment":"tencent-production"}]' || inputs.target == 'tencent' && '[{"key":"TENCENT","name":"腾讯云 CVM","environment":"tencent-production"}]' || '[{"key":"ALIYUN","name":"阿里云 ECS","environment":"aliyun-production"}]') }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy secrets
        env:
          PREFIX: ${{ matrix.key }}
          SSH_HOST: ${{ secrets[format('{0}_HOST', matrix.key)] }}
          SSH_USER: ${{ secrets[format('{0}_USER', matrix.key)] }}
          SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', matrix.key)] }}
          DEPLOY_PATH: ${{ secrets[format('{0}_PATH', matrix.key)] }}
          REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}
        run: |
          has_error=0
          for pair in HOST:SSH_HOST USER:SSH_USER SSH_KEY:SSH_KEY PATH:DEPLOY_PATH; do
            var="${pair#*:}"
            if [[ -z "${!var}" ]]; then
              echo "::error::缺少 ${PREFIX}_${pair%%:*} secret"
              has_error=1
            fi
          done
          if [[ -z "$REGISTRY_TOKEN" ]]; then
            echo "::error::缺少 TENCENT_TCR_PASSWORD secret"
            has_error=1
          fi
          if [[ $has_error -eq 1 ]]; then
            echo "请在 Settings -> Secrets and variables -> Actions 中配置以上 secrets"
            exit 1
          fi
          echo "Secrets 配置检查通过"

      - name: Sync deploy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets[format('{0}_HOST', matrix.key)] }}
          port: ${{ secrets[format('{0}_PORT', matrix.key)] || 22 }}
          username: ${{ secrets[format('{0}_USER', matrix.key)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', matrix.key)] }}
          source: 'deploy/manage.sh,deploy/nginx.conf'
          target: ${{ secrets[format('{0}_PATH', matrix.key)] }}
          strip_components: 1
          overwrite: true

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets[format('{0}_PATH', matrix.key)] }}
          REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY }}
          REGISTRY_USERNAME: ${{ vars.TENCENT_TCR_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}
          IMAGE_FULL_NAME: ${{ needs.build.outputs.image_tcr }}
        with:
          host: ${{ secrets[format('{0}_HOST', matrix.key)] }}
          port: ${{ secrets[format('{0}_PORT', matrix.key)] || 22 }}
          username: ${{ secrets[format('{0}_USER', matrix.key)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', matrix.key)] }}
          timeout: 60s
          command_timeout: 30m
          envs: DEPLOY_PATH,REGISTRY,REGISTRY_USERNAME,REGISTRY_TOKEN,IMAGE_FULL_NAME
          script: |
            set -e
            cd "$DEPLOY_PATH"
            chmod +x manage.sh
            trap 'docker logout "${REGISTRY}" >/dev/null 2>&1 || true' EXIT
            echo "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin
            ./manage.sh deploy "${IMAGE_FULL_NAME,,}"

  # ==================== 清理镜像仓库 ====================
  cleanup:
    name: Cleanup Registry
    needs: [build, deploy]
    if: >-
      always() && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/cleanup-registry.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ==================== 部署结果通知 ====================
  notify:
    name: Notify
    needs: [build, deploy, cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "# 部署结果"
            echo ""
            echo "| 阶段 | 状态 |"
            echo "|------|------|"
            echo "| 构建推送 | ${{ needs.build.result }} |"
            echo "| 部署（${{ inputs.target }}） | ${{ needs.deploy.result || 'skipped' }} |"
            echo "| 镜像清理 | ${{ needs.cleanup.result || 'skipped' }} |"
            echo ""
            echo "**Git Hash**: \`${{ needs.build.outputs.git_hash }}\`"
            echo "**构建时间**: ${{ needs.build.outputs.build_time }}"
          } >> "$GITHUB_STEP_SUMMARY"
